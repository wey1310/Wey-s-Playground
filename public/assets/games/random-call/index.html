<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGÔI SAO TRI THỨC V3 - Nebula Edition</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Paytone+One&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        /* --- CSS STYLING V3 --- */
        :root { --primary: #6c5ce7; --accent: #00cec9; --correct: #00b894; --wrong: #d63031; }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; 
            background: #000; /* Deep Space Black */
            font-family: 'Montserrat', sans-serif; color: white; 
        }
        
        #canvas-bg { position: absolute; top: 0; left: 0; z-index: 1; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        
        /* UI COMPONENTS */
        header { position: absolute; top: 20px; left: 20px; pointer-events: auto; z-index: 20; }
        h1 { margin: 0; font-family: 'Paytone One'; font-size: 3rem; color: #ffeaa7; text-shadow: 0 0 20px rgba(253, 203, 110, 0.8); }
        
        .btn-glass {
            display: inline-block; padding: 10px 20px; margin-right: 10px; margin-top: 10px;
            font-weight: bold; color: white; background: rgba(255,255,255,0.1); 
            border: 1px solid rgba(255,255,255,0.3); border-radius: 30px;
            backdrop-filter: blur(5px); cursor: pointer; transition: 0.3s;
        }
        .btn-glass:hover { background: rgba(255,255,255,0.3); }
        .btn-glass.active { background: var(--accent); color: #000; border-color: var(--accent); box-shadow: 0 0 15px var(--accent); }
        
        .tools { position: absolute; top: 20px; right: 20px; pointer-events: auto; display: flex; gap: 10px; }
        .camera-container {
            position: absolute; bottom: 20px; right: 20px; width: 200px; height: 150px;
            border: 2px solid rgba(255,255,255,0.2); border-radius: 15px; overflow: hidden; z-index: 20; opacity: 0.8;
        }
        #output_canvas { width: 100%; height: 100%; transform: scaleX(-1); }

        /* POPUPS */
        #result-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 100%; text-align: center; pointer-events: none; display: none; z-index: 50;
        }
        .student-card {
            display: inline-block; background: rgba(9, 132, 227, 0.8);
            border: 2px solid rgba(255,255,255,0.5); padding: 25px 50px; margin: 10px; border-radius: 50px;
            font-family: 'Paytone One'; font-size: 3rem; color: white;
            box-shadow: 0 0 50px rgba(9, 132, 227, 0.8); backdrop-filter: blur(10px);
            animation: zoomIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* QUIZ UI (Clear & Modern) */
        @keyframes zoomIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        /* Modal & Loader */
        #data-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; display: none; align-items: center; justify-content: center; pointer-events: auto; }
        .modal-content { background: #2d3436; padding: 30px; border-radius: 20px; width: 600px; color: white; }
        textarea { width: 100%; height: 150px; padding: 10px; border-radius: 10px; background: #1e272e; color: #fff; border: none; }
        #loading { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.5); font-style: italic; }
    </style>
</head>
<body>

    <video id="input_video" style="display: none;"></video>
    <canvas id="canvas-bg"></canvas>

    <div id="ui-layer">
        <header>
            <h1>NGÔI SAO TRI THỨC</h1>
            <div style="margin-top: 15px;">
                <button id="btn-mode-rollcall" class="btn-glass active" onclick="switchMode('rollcall')">Điểm Danh</button>
                
            </div>
        </header>

        
        <div class="tools">
            <button class="btn-glass" onclick="document.getElementById('list-modal').style.display='flex'">📝 Nhập Danh Sách</button>
            <button class="btn-glass" style="background:#e84393;border-color:#e84393;" onclick="notifyAppEnd()">Thoát Game</button>
        </div>


        <div class="camera-container"><canvas id="output_canvas"></canvas></div>
        <div id="result-overlay"></div>
        
    <div id="list-modal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; display: none; align-items: center; justify-content: center; pointer-events: auto;">
        <div style="background: #2d3436; padding: 30px; border-radius: 20px; width: 500px; color: white;">
            <h3>Nhập danh sách học sinh (Mỗi dòng 1 tên)</h3>
            <textarea id="students-input" style="width: 100%; height: 250px; padding: 10px; border-radius: 10px; background: #1e272e; color: #fff; border: none; margin-bottom: 15px; font-size: 16px;"></textarea>
            <div style="text-align: right;">
                <button class="btn-glass active" onclick="saveStudents()">Lưu & Cập nhật</button>
                <button class="btn-glass" onclick="document.getElementById('list-modal').style.display='none'">Đóng</button>
            </div>
        </div>
    </div>

        <div id="loading">Đang khởi động Camera...</div>

        </div>
    </div>
    </div>

    
    </div>

    <script>
        
        /* --- 1. CONFIG & AUDIO --- */
        const state = {
            students: ["An", "Bình", "Cường", "Dũng", "Giang"],
            rollCallFrozen: false,
            handPresent: false,
            handX: 0.5, handY: 0.5,
            gesture: -1,
            gestureStartTime: 0, lastTriggeredGesture: -1
        };

        const answerLogs = []; // To send back to parent

        // Listen for data from parent window
        window.addEventListener('message', (event) => {
            if (event.data?.type === 'INIT_DATA') {
                if (event.data.students && event.data.students.length > 0) {
                    state.students = event.data.students;
                    document.getElementById('students-input').value = state.students.join('\n');
                }
                initParticles();
            }
        });

        function notifyAppEnd() {
            window.parent.postMessage({ type: 'GAME_END', logs: answerLogs }, '*');
        }

        function saveStudents() {
            const lines = document.getElementById('students-input').value.split('\n').map(l=>l.trim()).filter(l=>l);
            if (lines.length > 0) {
                state.students = lines;
                initParticles();
                document.getElementById('list-modal').style.display='none';
                alert('Đã cập nhật ' + lines.length + ' học sinh');
            }
        }
, '*');
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const playTone = (f, t, d, v=0.1, del=0) => {
                const o = audioCtx.createOscillator(), g = audioCtx.createGain();
                o.type = t; o.frequency.setValueAtTime(f, audioCtx.currentTime + del);
                g.gain.setValueAtTime(v, audioCtx.currentTime + del);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + del + d);
                o.connect(g); g.connect(audioCtx.destination);
                o.start(audioCtx.currentTime + del); o.stop(audioCtx.currentTime + del + d);
            };
            if(type==='ting') { playTone(600,'sine',1); playTone(900,'sine',1,0.1,0.1); playTone(1200,'sine',1.5,0.1,0.2); }
            else if(type==='buzz') { playTone(150,'sawtooth',0.5); playTone(120,'sawtooth',0.5,0.1,0.1); }
            else if(type==='whoosh') { playTone(200,'triangle',1, 0.05); } // Sound khi bay
        }

        /* --- 2. PARTICLE SYSTEM (NEBULA CLOUDS) --- */
        const canvasBg = document.getElementById('canvas-bg');
        const ctxBg = canvasBg.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvasBg.width = window.innerWidth;
            canvasBg.height = window.innerHeight;
            initParticles();
        }

        class Particle {
            constructor(name) {
                this.name = name;
                this.x = Math.random() * canvasBg.width;
                this.y = Math.random() * canvasBg.height;
                // Velocity
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                // Appearance
                this.size = 30 + Math.random() * 40;
                this.hue = Math.random() * 60 + 180; // Blue/Cyan/Purple range
                this.alpha = Math.random() * 0.5 + 0.3;
            }

            update() {
                // PHYSICS ENGINE
                const targetX = state.handX * canvasBg.width;
                const targetY = state.handY * canvasBg.height;

                if (!state.handPresent) {
                    // IDLE: Bay lượn ngẫu nhiên (Wandering)
                    this.vx += (Math.random() - 0.5) * 0.1;
                    this.vy += (Math.random() - 0.5) * 0.1;
                    // Giữ tốc độ thấp
                    this.vx *= 0.99; this.vy *= 0.99;
                } else {
                    // Tương tác tay
                    const dx = targetX - this.x;
                    const dy = targetY - this.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);

                    if (state.gesture === 0) {
                        // FIST: Tụ lại (Attraction) - Lực hút mạnh
                        const force = 0.05; 
                        this.vx += dx * force;
                        this.vy += dy * force;
                        this.vx *= 0.9; // Friction cao để tụ nhanh mà ko văng
                        this.vy *= 0.9;
                    } else {
                        // OPEN/OTHERS: Bay theo nhưng tản ra (Flocking)
                        // Lực hút về tay (nhẹ hơn fist)
                        this.vx += dx * 0.005;
                        this.vy += dy * 0.005;

                        // Lực đẩy nếu quá gần tay (Tản ra)
                        if (dist < 200) {
                            this.vx -= dx * 0.02;
                            this.vy -= dy * 0.02;
                        }
                        this.vx *= 0.95; // Friction vừa phải
                        this.vy *= 0.95;
                    }
                }

                // Cập nhật vị trí
                this.x += this.vx;
                this.y += this.vy;

                // Border wrap (bay qua trái về phải)
                if(this.x < -100) this.x = canvasBg.width + 100;
                if(this.x > canvasBg.width + 100) this.x = -100;
                if(this.y < -100) this.y = canvasBg.height + 100;
                if(this.y > canvasBg.height + 100) this.y = -100;
            }

            draw() {
                // GLOW EFFECT (Soft Cloud)
                ctxBg.save();
                
                // Nếu đang Quiz mode -> Làm mờ hạt, ẩn tên
                const masterAlpha = 1; 

                // Vẽ quầng sáng
                const gradient = ctxBg.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
                gradient.addColorStop(0, `hsla(${this.hue}, 100%, 80%, ${this.alpha * masterAlpha})`); // Tâm sáng
                gradient.addColorStop(1, `hsla(${this.hue}, 100%, 50%, 0)`); // Ngoài trong suốt

                ctxBg.fillStyle = gradient;
                ctxBg.beginPath();
                ctxBg.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctxBg.fill();

                // Vẽ tên (Chỉ hiện khi KHÔNG phải Quiz mode)
                if (this.name) {
                    ctxBg.fillStyle = `rgba(255, 255, 255, ${0.9 * masterAlpha})`;
                    ctxBg.font = "bold 14px 'Montserrat'";
                    ctxBg.textAlign = "center";
                    ctxBg.textBaseline = "middle";
                    ctxBg.fillText(this.name, this.x, this.y);
                }

                ctxBg.restore();
            }
        }

        function initParticles() {
            particles = [];
            state.students.forEach(name => particles.push(new Particle(name)));
            // Thêm hạt trang trí nếu ít học sinh
            const extra = 40 - particles.length;
            for(let i=0; i<extra; i++) particles.push(new Particle(""));
        }

        function animate() {
            // Xóa màn hình nhưng để lại trail (đuôi) nhẹ
            ctxBg.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctxBg.fillRect(0, 0, canvasBg.width, canvasBg.height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }

        /* --- 3. LOGIC XỬ LÝ --- */
        // Logic Gọi tên
        
        function handleLogic(gesture) {
            if (gesture === 5) {
                state.rollCallFrozen = false;
                document.getElementById('result-overlay').style.display = 'none';
            } else if (gesture >= 1 && gesture <= 4 && !state.rollCallFrozen) {
                playSound('ting');
                state.rollCallFrozen = true;
                const count = Math.min(gesture, state.students.length);
                const picked = [...state.students].sort(()=>Math.random()-0.5).slice(0, count);
                
                document.getElementById('result-overlay').innerHTML = picked.map(n => `<div class="student-card">${n}</div>`).join('');
                document.getElementById('result-overlay').style.display = 'block';
            }
        }

            const q = state.questions[state.currentQIndex];
            document.getElementById('question-text').innerText = q.q;
            ['a','b','c'].forEach(k => {
                const el = document.getElementById('ans-'+k);
                el.innerText = k.toUpperCase() + ". " + q[k];
                el.className = 'answer-box';
            });
            document.getElementById('quiz-container').style.display = 'block';
            document.querySelector('.answers-grid').style.display = 'grid';
            state.isAnswering = true;
            playSound('whoosh');
        }

        /* --- 4. INPUT & MEDIAPIPE --- */
        function handleFileUpload(input) {
            const file = input.files[0]; if(!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                let names = [];
                if(file.name.match(/\.xls/)) {
                    const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
                    const ws = wb.Sheets[wb.SheetNames[0]];
                    XLSX.utils.sheet_to_json(ws, {header:1}).forEach(r => r[0] && names.push(r[0].toString().trim()));
                } else {
                    names = e.target.result.split(/\n/).map(l=>l.trim()).filter(l=>l);
                }
                if(names.length) { state.students = names; initParticles(); alert(`Đã nhận ${names.length} học sinh!`); }
            };
            file.name.match(/\.txt/) ? reader.readAsText(file) : reader.readAsArrayBuffer(file);
        }
        function openQuizEditor() { document.getElementById('data-modal').style.display='flex'; document.getElementById('quiz-data-input').value = JSON.stringify(state.questions,null,2); }
        function saveQuizData() { try { state.questions=JSON.parse(document.getElementById('quiz-data-input').value); document.getElementById('data-modal').style.display='none'; state.currentQIndex=-1; } catch(e){alert('Lỗi JSON');} }

        // AI CAMERA
        const videoEl = document.getElementById('input_video');
        const canvasOut = document.getElementById('output_canvas');
        const ctxOut = canvasOut.getContext('2d');
        const hands = new Hands({locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
        hands.setOptions({maxNumHands:1, modelComplexity:1, minDetectionConfidence:0.7, minTrackingConfidence:0.5});
        
        hands.onResults(res => {
            ctxOut.clearRect(0,0,canvasOut.width,canvasOut.height);
            ctxOut.drawImage(res.image, 0, 0, canvasOut.width, canvasOut.height);
            
            if (res.multiHandLandmarks.length > 0) {
                state.handPresent = true;
                const lm = res.multiHandLandmarks[0];
                drawConnectors(ctxOut, lm, HAND_CONNECTIONS, {color:'#00cec9', lineWidth:2});
                
                // Calculate Fingers
                let count = 0;
                if(lm[8].y < lm[6].y) count++; if(lm[12].y < lm[10].y) count++;
                if(lm[16].y < lm[14].y) count++; if(lm[20].y < lm[18].y) count++;
                if(Math.abs(lm[4].x - lm[9].x) > 0.08) count++; // Thumb loose check
                if(count<=1 && lm[8].y > lm[6].y) count = 0; // Force fist
                if(count>4) count=5;
                
                state.gesture = count;
                state.handX = 1 - lm[9].x; // Mirror X
                state.handY = lm[9].y;

                // Trigger Logic (Debounce)
                const now = Date.now();
                if(state.gesture !== state.lastTriggeredGesture) {
                    if(now - state.gestureStartTime > 400) { // Hold 0.4s to trigger
                        handleLogic(state.gesture);
                        state.lastTriggeredGesture = state.gesture;
                        state.gestureStartTime = now;
                    }
                } else { state.gestureStartTime = now - 200; } // Keep waiting if same
            } else {
                state.handPresent = false;
            }
        });

        const camera = new Camera(videoEl, {onFrame: async()=>{await hands.send({image:videoEl})}, width:640, height:480});
        camera.start().then(() => document.getElementById('loading').style.display='none');
        
        // Init
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        animate();
    </script>
</body>
</html>
